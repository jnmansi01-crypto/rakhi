<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #1a0505; display: flex; gap: 20px; padding: 50px; }
  .bead-shadow { filter: drop-shadow(0 10px 10px rgba(0,0,0,0.8)); }
</style>
</head>
<body>

  <!-- Bead 1: Gold Fluted Bead -->
  <svg class="bead-shadow" width="40" height="40" viewBox="0 0 40 40">
    <defs>
      <radialGradient id="goldGrad" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FFF5C3"/>
        <stop offset="40%" stop-color="#D4AF37"/>
        <stop offset="80%" stop-color="#996515"/>
        <stop offset="100%" stop-color="#4A3505"/>
      </radialGradient>
    </defs>
    <circle cx="20" cy="20" r="18" fill="url(#goldGrad)" />
    <!-- Fluting lines -->
    <path d="M 2 20 Q 20 2 38 20" fill="none" stroke="#4A3505" stroke-width="1" opacity="0.5"/>
    <path d="M 2 20 Q 20 38 38 20" fill="none" stroke="#4A3505" stroke-width="1" opacity="0.5"/>
    <path d="M 20 2 Q 2 20 20 38" fill="none" stroke="#4A3505" stroke-width="1" opacity="0.5"/>
    <path d="M 20 2 Q 38 20 20 38" fill="none" stroke="#4A3505" stroke-width="1" opacity="0.5"/>
    <!-- Center hole -->
    <circle cx="20" cy="20" r="4" fill="#2A1505" />
  </svg>

  <!-- Bead 2: Kundan Centerpiece -->
  <svg class="bead-shadow" width="80" height="80" viewBox="0 0 80 80">
    <defs>
      <radialGradient id="ruby" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FF6B6B"/>
        <stop offset="40%" stop-color="#D90429"/>
        <stop offset="80%" stop-color="#8D0801"/>
        <stop offset="100%" stop-color="#2B0202"/>
      </radialGradient>
      <radialGradient id="pearl" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="70%" stop-color="#FDFBF7"/>
        <stop offset="100%" stop-color="#D4CBBB"/>
      </radialGradient>
    </defs>
    <!-- Gold base -->
    <path d="M 40 4 L 76 40 L 40 76 L 4 40 Z" fill="url(#goldGrad)" stroke="#4A3505" stroke-width="2"/>
    <!-- Inner Gold border -->
    <path d="M 40 12 L 68 40 L 40 68 L 12 40 Z" fill="none" stroke="#FFF5C3" stroke-width="1.5"/>
    <!-- Ruby center -->
    <path d="M 40 18 L 62 40 L 40 62 L 18 40 Z" fill="url(#ruby)"/>
    <!-- Ruby facet highlight -->
    <path d="M 40 18 L 50 30 L 40 40 L 30 30 Z" fill="rgba(255,255,255,0.2)"/>
    <!-- Pearls around edges -->
    <circle cx="40" cy="4" r="6" fill="url(#pearl)" />
    <circle cx="76" cy="40" r="6" fill="url(#pearl)" />
    <circle cx="40" cy="76" r="6" fill="url(#pearl)" />
    <circle cx="4" cy="40" r="6" fill="url(#pearl)" />
  </svg>

  <!-- Bead 3: Pearl with gold caps -->
  <svg class="bead-shadow" width="40" height="40" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="16" fill="url(#pearl)" />
    <!-- Gold caps left and right -->
    <path d="M 4 14 Q 10 20 4 26 L 2 26 Q 8 20 2 14 Z" fill="url(#goldGrad)" />
    <path d="M 36 14 Q 30 20 36 26 L 38 26 Q 32 20 38 14 Z" fill="url(#goldGrad)" />
  </svg>

</body>
</html>
